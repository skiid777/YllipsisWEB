.id .tile { flex: none; width: 104px; height: 110px; }
.id-t { min-width: 0; }
.eyebrow { margin: 0; font-family: var(--font-mono); font-size: 0.74rem; color: var(--fg-2); text-transform: uppercase; letter-spacing: 0.06em; }
.id h2 { margin: 4px 0 0; font-size: clamp(2rem, 5vw, 2.9rem); font-weight: 800; font-stretch: 115%; letter-spacing: -0.02em; line-height: 1; overflow-wrap: anywhere; }
.id .en { margin: 6px 0 0; font-family: var(--font-mono); font-size: 0.8rem; color: var(--fg-2); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px 4px 8px; border-radius: 999px; border: 1px solid var(--line); font-size: 0.8rem; font-weight: 500; background: var(--surface-2); }
.pill i { width: 12px; height: 12px; border-radius: 3px; background: hsl(var(--h) var(--cs) var(--cl)); border: 1px solid hsl(var(--h) 40% 45% / 0.5); }
.pill i.s-solid { background: var(--st-solid); border-color: var(--line); }
.pill i.s-liquid { background: var(--st-liq); border-color: var(--line); }
.pill i.s-gas { background: var(--st-gas); background-image: radial-gradient(var(--st-gas-fg) 0.9px, transparent 1.2px); background-size: 4px 4px; border-color: var(--line); }
.pill i.s-na { background: var(--na); border-color: var(--line); }
.look { margin: 14px 0 0; color: var(--fg-2); font-size: 0.92rem; }
.look b { color: var(--fg); font-weight: 600; }
.fact { margin: 14px 0 0; font-size: 1.02rem; line-height: 1.5; text-wrap: pretty; }

.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 30px; }
.sec { min-width: 0; }
.sec.full { grid-column: 1 / -1; }
.sec h3 { margin: 0 0 10px; font-size: 0.74rem; font-family: var(--font-mono); font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--fg-2); display: flex; align-items: center; gap: 10px; }
.sec h3::after { content: ""; flex: 1; height: 1px; background: var(--line-2); }
.prop { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 16px; padding: 9px 0; border-bottom: 1px solid var(--line-2); align-items: center; }
.prop:last-child { border-bottom: 0; }
.pk { font-size: 0.8rem; color: var(--fg-2); display: block; }
.pv { font-family: var(--font-mono); font-size: 0.98rem; font-weight: 600; display: block; font-variant-numeric: tabular-nums; }
.pv.na { color: var(--fg-2); font-weight: 400; font-size: 0.86rem; }
.pr { font-size: 0.72rem; color: var(--fg-2); font-family: var(--font-mono); }
.pn2 { font-size: 0.72rem; color: var(--fg-2); display: block; margin-top: 2px; }
.ps { min-width: 0; }
.ps svg { width: 100%; height: 22px; display: block; overflow: visible; }
.pax { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.64rem; color: var(--fg-2); }
.dot { fill: var(--dot); opacity: 0.55; }
.dot.me { fill: hsl(var(--h) var(--ms) var(--ml)); opacity: 1; stroke: var(--surface); stroke-width: 2; }
.axis { stroke: var(--line); stroke-width: 1; }

.tbar { display: flex; height: 16px; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); background: var(--na); }
.tbar i { display: block; height: 100%; }
.tmark { position: relative; height: 20px; }
.tmark span { position: absolute; top: 0; transform: translateX(-50%); font-family: var(--font-mono); font-size: 0.64rem; color: var(--fg-2); white-space: nowrap; }
.tmark span::before { content: ""; display: block; width: 1px; height: 6px; background: var(--fg-2); margin: 0 auto 1px; }
.tmark span.room { color: var(--fg); font-weight: 600; }
.tmark span.room::before { height: 10px; background: var(--fg); margin-top: -4px; }
.tnote { margin: 8px 0 0; font-size: 0.82rem; color: var(--fg-2); }
.tkey { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 0.76rem; color: var(--fg-2); }
.tkey span { display: inline-flex; align-items: center; gap: 6px; }
.tkey i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

.sh { font-family: var(--font-mono); font-size: 0.9rem; font-weight: 600; margin: 0 0 12px; }
.sh em { font-style: normal; color: var(--fg-2); font-weight: 400; font-size: 0.78rem; }
.cfgl { display: flex; flex-wrap: wrap; gap: 6px; }
.cc { font-family: var(--font-mono); font-size: 0.82rem; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px 5px; background: var(--surface-2); min-width: 54px; }
.cc b { font-weight: 600; }
.cc .fb { display: block; height: 3px; border-radius: 2px; margin-top: 3px; background: var(--line); overflow: hidden; }
.cc .fb i { display: block; height: 100%; background: hsl(var(--h) var(--ms) var(--ml)); }
.cc.outer { border-color: hsl(var(--h) var(--ms) var(--ml)); }
.ion svg { width: 100%; height: auto; display: block; overflow: visible; }
.bar { fill: var(--bar); }
.bar.jump { fill: hsl(var(--h) var(--ms) var(--ml)); }
.ion .cap { margin: 8px 0 0; font-size: 0.82rem; color: var(--fg-2); text-wrap: pretty; }
.tx { font-family: var(--font-mono); font-size: 9px; fill: var(--fg-2); }

.hist { display: grid; gap: 8px; margin: 0; }
.hist div { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: 10px; }
.hist dt { color: var(--fg-2); font-size: 0.82rem; }
.hist dd { margin: 0; font-size: 0.92rem; text-wrap: pretty; }
.uses { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.uses li { border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; font-size: 0.85rem; background: var(--surface-2); }
.mend { border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: var(--surface-2); }
.mend p { margin: 0 0 10px; font-size: 0.88rem; text-wrap: pretty; }
.mend table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
.mend th, .mend td { text-align: left; padding: 5px 8px 5px 0; border-bottom: 1px solid var(--line-2); font-variant-numeric: tabular-nums; }
.mend th { font-weight: 500; color: var(--fg-2); font-size: 0.76rem; font-family: var(--font-mono); }
.mend td:not(:first-child) { font-family: var(--font-mono); font-weight: 600; }
.mend tr:last-child td { border-bottom: 0; }
.mini { display: flex; flex-wrap: wrap; gap: 4px; }
.mini button { width: 44px; height: 44px; border-radius: 4px; border: 1px solid hsl(var(--h) 40% 45% / 0.4); background: hsl(var(--h) var(--cs) var(--cl)); color: var(--on-cell); font-weight: 700; font-size: 0.95rem; font-stretch: 106%; position: relative; padding: 0; }
.mini button small { position: absolute; left: 3px; top: 1px; font-family: var(--font-mono); font-size: 0.55rem; font-weight: 400; opacity: 0.8; }
.mini button[aria-current="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.mini button:hover { transform: translateY(-1px); }
.cfoot { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; font-size: 0.82rem; color: var(--fg-2); }
.cfoot a { color: var(--accent); font-weight: 600; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: scale(0.72); } }
@keyframes swap { from { opacity: 0; transform: translateY(6px); } }
@keyframes sheet { from { transform: translateY(40px); opacity: 0; } }

@media (max-width: 720px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .lc { max-width: 320px; margin-inline: auto; width: 100%; }
  .shells { justify-content: center; }
  .cols { grid-template-columns: minmax(0, 1fr); }
  .prop { grid-template-columns: minmax(0, 1fr); }
  .hist div { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .cbtn kbd { display: none; }
}
@media (max-width: 640px) {
  .scrim { place-items: end stretch; padding: 0; }
  .card { width: 100%; max-height: 94%; border-radius: 16px 16px 0 0; animation: sheet 0.26s ease; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .id .tile { width: 88px; height: 93px; }
  .chead .yl-share { width: 34px; padding: 0; justify-content: center; }
  .chead .yl-share-tx { display: none; }
  .chead .yl-burst { left: 50%; }
}
.chead .yl-share { height: 34px; border-radius: 8px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

    $('#foot').innerHTML = LANG === 'en'
      ? '<p>Numerical data: <a href="https://github.com/Bowserinator/Periodic-Table-JSON" target="_blank" rel="noopener">Periodic-Table-JSON</a> (CC BY-SA 3.0, based on Wikipedia). Descriptions, etymologies and trivia: original text.</p><p>Temperatures refer to a pressure of 1 atm. For elements from fermium (Z ≥ 100), and for francium and astatine, values are estimated or missing. A diamond in the corner of a tile marks an element that Mendeleev predicted before it was discovered.</p>'
      : '<p>Dane liczbowe: <a href="https://github.com/Bowserinator/Periodic-Table-JSON" target="_blank" rel="noopener">Periodic-Table-JSON</a> (CC BY-SA 3.0, oparte na Wikipedii). Opisy, etymologie i ciekawostki: opracowanie własne.</p><p>Temperatury odnoszą się do ciśnienia 1 atm. Dla pierwiastków od fermu (Z ≥ 100) oraz franu i astatu wartości są szacunkowe lub brakuje danych. Romb w rogu kafelka oznacza pierwiastek, który Mendelejew przewidział przed jego odkryciem.</p>';
  }
  function applyStatic() {
    document.title = $t('Tablica Mendelejewa · Yllipsis-skiid777', "Mendeleev's Table · Yllipsis-skiid777");
    document.querySelectorAll('[data-pl]').forEach(function (n) {
      var v = n.getAttribute('data-' + LANG), a = n.getAttribute('data-attr');
      if (a) n.setAttribute(a, v); else n.textContent = v;
    });
    $('#app').classList.toggle('l-en', LANG === 'en');
    renderFoot();
  }
  function refreshLang() {
    applyStatic();
    renderPropSel();
    labelCells();
    renderLegend();
    applyView();
    hovIdle();
    if (!$('#sugg').hidden) renderSugg();
    if (S.open != null) showCard(S.open);
  }
  document.addEventListener('yllipsis:lang', function (ev) { LANG = ev.detail.lang; refreshLang(); });

  function setMode(m) {
    S.mode = m;
    document.querySelectorAll('.seg button[data-mode]').forEach(function (b) { b.setAttribute('aria-checked', String(b.dataset.mode === m)); });
    $('#propWrap').hidden = m !== 'prop';
    renderLegend();
    applyView();
    hovIdle();
  }

  function init() {
    build();
    hovEl = $('#hov');
    var sel = $('#propSel');
    sel.addEventListener('change', function () { S.prop = sel.value; renderLegend(); applyView(); });
    applyStatic();
    renderPropSel();
    labelCells();

    document.querySelectorAll('.seg button[data-mode]').forEach(function (b) { b.addEventListener('click', function () { setMode(b.dataset.mode); }); });

    legendEl.addEventListener('click', function (ev) {
      var chip = ev.target.closest('.chip');
      if (chip) { S.cat = S.cat === chip.dataset.cat ? null : chip.dataset.cat; renderLegend(); applyView(); return; }
      var pre = ev.target.closest('.presets button');
      if (pre) { S.T = +pre.dataset.t; $('#tslide').value = S.T; applyView(); }
    });
    legendEl.addEventListener('input', function (ev) {
      if (ev.target.id === 'tslide') { S.T = +ev.target.value; applyView(); }
    });

    var q = $('#q'), sugg = $('#sugg');
    q.addEventListener('input', function () { S.q = q.value; S.active = 0; applyView(); renderSugg(); });
    q.addEventListener('focus', function () { renderSugg(); });
    q.addEventListener('keydown', function (ev) {
      var n = S.res ? Math.min(S.res.length, 8) : 0;
      if (ev.key === 'ArrowDown' && n) { ev.preventDefault(); S.active = (S.active + 1) % n; renderSugg(); }
      else if (ev.key === 'ArrowUp' && n) { ev.preventDefault(); S.active = (S.active + n - 1) % n; renderSugg(); }
      else if (ev.key === 'Enter') {
        if (S.res && S.res[S.active]) { var z = S.res[S.active].e.z; suggOpen(false); showCard(z, cells[z]); }
      }
      else if (ev.key === 'Escape') {
        if (!sugg.hidden) suggOpen(false);
        else { q.value = ''; S.q = ''; applyView(); }
      }
    });
    sugg.addEventListener('mousedown', function (ev) { ev.preventDefault(); });
    sugg.addEventListener('click', function (ev) {
      var it = ev.target.closest('.sg'), ex = ev.target.closest('[data-ex]');
      if (it) { var z = +it.dataset.z; suggOpen(false); showCard(z, cells[z]); }
      else if (ex) { q.value = ex.dataset.ex; S.q = q.value; S.active = 0; applyView(); renderSugg(); q.focus(); }
    });
    q.addEventListener('blur', function () { setTimeout(function () { if (document.activeElement !== q) suggOpen(false); }, 120); });
    document.addEventListener('click', function (ev) { if (!ev.target.closest('.search')) suggOpen(false); });

    $('#rnd').addEventListener('click', function () {
      var e = EL[Math.floor(Math.random() * EL.length)];
      showCard(e.z, cells[e.z]);
    });

    ptEl.addEventListener('click', function (ev) {
      var b = ev.target.closest('.el');
      if (b) { setRoving(b); showCard(+b.dataset.z, b); }
    });
    ptEl.addEventListener('keydown', function (ev) {
      var b = ev.target.closest('.el');
      if (b && /^Arrow/.test(ev.key)) { ev.preventDefault(); moveFocus(b, ev.key); }
    });
    ptEl.addEventListener('mouseover', function (ev) {
      var b = ev.target.closest('.el');
      if (b) hovShow(byZ[b.dataset.z]);
    });
    ptEl.addEventListener('mouseleave', hovIdle);
    ptEl.addEventListener('focusin', function (ev) {
      var b = ev.target.closest('.el');
      if (b) hovShow(byZ[b.dataset.z]);
    });

    scrim.addEventListener('click', function (ev) { if (ev.target === scrim) closeCard(); });
    $('#cclose').addEventListener('click', closeCard);
    $('#cprev').addEventListener('click', function () { step(-1); });
    $('#cnext').addEventListener('click', function () { step(1); });
    cbody.addEventListener('click', function (ev) {
      var g = ev.target.closest('[data-go]');
      if (g) showCard(+g.dataset.go);
    });
    cbody.addEventListener('mouseover', function (ev) { var c = ev.target.closest('.sc'); if (c) hlShell(+c.dataset.i, true); });
    cbody.addEventListener('mouseout', function (ev) { var c = ev.target.closest('.sc'); if (c) hlShell(+c.dataset.i, false); });
    cbody.addEventListener('focusin', function (ev) { var c = ev.target.closest('.sc'); if (c) hlShell(+c.dataset.i, true); });
    cbody.addEventListener('focusout', function (ev) { var c = ev.target.closest('.sc'); if (c) hlShell(+c.dataset.i, false); });
    document.addEventListener('keydown', function (ev) {
      if (scrim.hidden) return;
      if (ev.key === 'Escape') { ev.preventDefault(); closeCard(); }
      else if (ev.key === 'ArrowLeft') { ev.preventDefault(); step(-1); }
      else if (ev.key === 'ArrowRight') { ev.preventDefault(); step(1); }
      else if (ev.key === 'Tab') {
        var f = card.querySelectorAll('button:not([hidden]), a[href]'), a = f[0], z = f[f.length - 1];
        if (ev.shiftKey && document.activeElement === a) { ev.preventDefault(); z.focus(); }
        else if (!ev.shiftKey && document.activeElement === z) { ev.preventDefault(); a.focus(); }
      }
    });

    renderLegend();
    applyView();
    hovIdle();

    try {
      var h = decodeURIComponent((location.hash || '').slice(1)).toLowerCase();
      if (h) {
        var f2 = EL.filter(function (e) { return e.s.toLowerCase() === h; })[0];
        if (f2) showCard(f2.z, cells[f2.z]);
      }
    } catch (x) {  }
  }
  init();
})();
</script>
</body>
</html>
